<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Compás — prototype</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f7; font: 15px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; overscroll-behavior: none; }
  #app { height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 48px; }
  /* The screen keeps the 430:932 shape and fits whatever space it has. */
  #stage { position: relative; aspect-ratio: 430 / 932; height: min(100dvh, calc(100vw * 932 / 430)); container-type: size; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .hot { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 10px; }
  .hot:focus-visible { outline: 2px solid #0a84ff; }
  .hold { position: absolute; pointer-events: none; border-radius: 10px; }
  .show .hot { background: rgba(10, 132, 255, .28); outline: 1.5px solid rgba(10, 132, 255, .9); }
  .show .hold { outline: 2px dashed rgba(255, 159, 10, .95); }
  .flash .hot { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 55% { background: rgba(10, 132, 255, .38); outline: 2px solid rgba(10, 132, 255, .95); } 100% { background: transparent; outline: 2px solid transparent; } }
  #toast { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); background: rgba(0, 0, 0, .82); color: #fff; padding: 9px 15px; border-radius: 18px; font-size: 13px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 2; }
  #toast.on { opacity: 1; }
  #menuBtn { position: absolute; left: 34%; top: 1.6%; width: 32%; height: 4.6%; border: 0; background: transparent; cursor: pointer; border-radius: 30px; }
  #menuBtn.has::after { content: ''; position: absolute; right: 12%; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: #ff9f0a; }
  .ev h3 { font-size: 13px; font-weight: 600; color: #ff9f0a; margin: 4px 0 6px; } .ev { margin-bottom: 14px; }
  .ev button { all: unset; cursor: pointer; display: block; padding: 8px 12px; margin: 0 0 6px; border-radius: 10px; background: #2c2c2e; color: #f2f2f7; font-size: 14px; }
  .ev button:hover { background: #3a3a3c; }
  #hint { position: absolute; left: 50%; top: 7.5%; transform: translateX(-50%); background: rgba(0, 0, 0, .78); color: #fff; padding: 8px 14px; border-radius: 18px; font-size: 13px; white-space: nowrap; pointer-events: none; transition: opacity .6s; }
  #side { width: 300px; max-height: 92dvh; overflow: auto; display: none; }
  #side h1 { font-size: 22px; margin: 0 0 4px; } #side p { color: #98989f; margin: 0 0 16px; }
  .list { display: grid; gap: 2px; }
  .list button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 8px; color: #d1d1d6; display: flex; gap: 10px; }
  .list button:hover { background: #1c1c1e; } .list button.on { background: #0a84ff; color: #fff; }
  .list b { width: 26px; font-weight: 600; }
  label.tog { display: flex; gap: 8px; align-items: center; margin: 14px 0; color: #d1d1d6; cursor: pointer; }
  #sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .86); display: none; overflow: auto; padding: 24px 18px 40px; z-index: 5; }
  #sheet.open { display: block; }
  #sheet h2 { margin: 0 0 12px; font-size: 20px; } #sheet .close { position: sticky; top: 0; float: right; all: unset; cursor: pointer; padding: 6px 12px; background: #2c2c2e; border-radius: 16px; }
  /* Wide screens: show a phone body around the screen and the screen list beside it. */
  @media (min-width: 820px) and (min-height: 600px) {
    body { background: #111114; }
    #stage { height: min(86dvh, 932px); border-radius: calc(min(86dvh, 932px) * 0.06); overflow: hidden; box-shadow: 0 0 0 12px #0b0b0d, 0 0 0 14px #2a2a2e, 0 30px 80px rgba(0, 0, 0, .6); }
    #side { display: block; } #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <img id="shot" alt="">
    <div id="hots"></div>
    <button id="menuBtn" aria-label="Open the list of screens"></button>
    <div id="hint">Tap the black pill for all screens</div>
    <div id="toast">Not clickable in this prototype. Blue areas are.</div>
  </div>
  <aside id="side">
    <h1>Compás</h1>
    <p>Clickable prototype. Tap the screen like a real app. Press and hold a move in the library, or a take, for more actions.</p>
    <p><a href="map.html" style="color:#0a84ff">Navigation map</a></p>
    <label class="tog"><input type="checkbox" id="showHots"> Show where to tap (dashed: press and hold)</label>
    <div class="ev" id="evSide"></div>
    <div class="list" id="listSide"></div>
  </aside>
</div>
<div id="sheet"><button class="close" id="closeSheet">Close</button><div class="ev" id="evSheet"></div><h2>All screens</h2><p><a href="map.html" style="color:#0a84ff">Navigation map</a></p><div class="list" id="listSheet"></div></div>
<script src="data.js?v=mwppkmpz"></script>
<script>
const byId = Object.fromEntries(SCREENS.map(s => [s.id, s]));
// Self-check: every tap area must lead to a screen that exists.
for (const s of SCREENS) for (const h of s.h) console.assert(h[4] === 'back' || byId[h[4]], 'bad destination', s.id, h[4]);

const stage = document.getElementById('stage'), shot = document.getElementById('shot'), hots = document.getElementById('hots');
const stack = []; let current = null, timer = null;

function show(id, push = true) {
  const s = byId[id]; if (!s) return;
  clearTimeout(timer);
  if (push && current) stack.push(current);
  current = id;
  shot.src = 'img/' + id + '.jpg?v=' + BUILD; shot.alt = s.t;
  hots.replaceChildren(...s.h.map(([x, y, w, h, to, how, tag]) => {
    const hold = tag === 'hold';
    const b = document.createElement(hold ? 'div' : 'button'); b.className = hold ? 'hold' : 'hot'; b.setAttribute('aria-label', to === 'back' ? 'Back' : 'Go to ' + byId[to].t);
    b.style.cssText = `left:${x / 4.3}%;top:${y / 9.32}%;width:${w / 4.3}%;height:${h / 9.32}%`;
    // An area tagged "alt" is a back button whose result depends on the screen underneath (for example Done on a form):
    // when navigation.md names a result for that screen, the result replaces it.
    if (!hold) b.onclick = e => { e.stopPropagation(); const alt = tag === 'alt' && s.alt && s.alt[stack[stack.length - 1]]; if (alt) { stack.pop(); show(alt[0], false); } else go(to, how); };
    return b;
  }));
  if (s.auto) timer = setTimeout(() => current === id && go(s.auto[0], s.auto[2]), s.auto[1]);
  // Things that can happen on this screen without a tap (a full phone, an empty camera roll, turning the phone).
  for (const el of [document.getElementById('evSide'), document.getElementById('evSheet')]) {
    el.replaceChildren(); if (!s.e) continue;
    const h = document.createElement('h3'); h.textContent = 'What can happen here'; el.append(h, ...s.e.map(([label, to, how]) => { const b = document.createElement('button'); b.textContent = label + ' → ' + byId[to].t; b.onclick = () => { sheet.classList.remove('open'); go(to, how); }; return b; }));
  }
  document.getElementById('menuBtn').classList.toggle('has', !!s.e);
  history.replaceState(null, '', '#' + id);
  document.querySelectorAll('.list button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
}
function back() { stack.length ? show(stack.pop(), false) : show('B2', false); }
// How a link behaves comes from docs/product/navigation.md.
const TAB_ROOT = { G: 'G1', H: 'H1', I: 'I1' }; // every other flow belongs to the Library
function go(to, how) {
  if (to === 'back' || how === 'back') return back();
  if (how === 'switch' || how === 'auto') return show(to, false);                     // replaces the current state
  if (how === 'tab') { stack.length = 0; return show(to, false); }
  if (how === 'home') {                                             // finishes a task: clear the trail
    if (to === 'B1' && stack.includes('I1')) to = 'I1';             // the introduction replayed from Settings returns there
    const root = TAB_ROOT[to[0]] || 'B2';
    stack.length = 0; if (to !== root && to !== 'B1' && !byId[to].root) stack.push(root);
    return show(to, false);
  }
  show(to);
}
// Swiping from the left edge goes back, as on an iPhone. Escape does the same on a computer.
// Screens that list a swipe in navigation.md (the introduction pages) move with a sideways swipe or the arrow keys.
let swipe = null, edge = false;
const swipeTo = dir => { const s = byId[current].sw; if (s && s[dir]) { go(...s[dir]); return true; } return false; };
stage.addEventListener('touchstart', e => { const t = e.touches[0]; swipe = t.clientX; edge = swipe - stage.getBoundingClientRect().left < 30; }, { passive: true });
stage.addEventListener('touchend', e => { if (swipe === null) return; const dx = e.changedTouches[0].clientX - swipe; swipe = null; if (dx < -60 && swipeTo('left')) return; if (dx > 60 && swipeTo('right')) return; if (edge && dx > 70) back(); });
addEventListener('keydown', e => { if (e.key === 'Escape') back(); if (e.key === 'ArrowRight') swipeTo('left'); if (e.key === 'ArrowLeft') swipeTo('right'); });

// Pressing and holding (about half a second) on an area marked "hold" opens its menu, as a long-press does on an iPhone.
let holdTimer = null, held = false;
stage.addEventListener('pointerdown', e => {
  const r = stage.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * 430, py = (e.clientY - r.top) / r.height * 932;
  const a = byId[current].h.find(h => h[6] === 'hold' && px >= h[0] && px <= h[0] + h[2] && py >= h[1] && py <= h[1] + h[3]);
  if (a) holdTimer = setTimeout(() => { held = true; go(a[4], a[5]); }, 500);
});
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) stage.addEventListener(ev, () => { clearTimeout(holdTimer); setTimeout(() => held = false, 60); });
stage.addEventListener('click', e => { if (held) { held = false; e.stopPropagation(); e.preventDefault(); } }, true); // the tap that ends a hold must not count as a tap
stage.addEventListener('contextmenu', e => e.preventDefault());

// A tap that misses every tap area shows them and says so, so nobody is left guessing.
const toast = document.getElementById('toast'); let toastTimer = null;
stage.onclick = () => {
  if (!byId[current].h.length) return;
  stage.classList.remove('flash'); void stage.offsetWidth; stage.classList.add('flash');
  toast.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('on'), 1600);
};

for (const el of [document.getElementById('listSide'), document.getElementById('listSheet')])
  el.append(...SCREENS.map(s => { const b = document.createElement('button'); b.dataset.id = s.id; b.innerHTML = `<b>${s.id}</b><span>${s.t}</span>`; b.onclick = () => { sheet.classList.remove('open'); stack.length = 0; show(s.id, false); }; return b; }));
const sheet = document.getElementById('sheet');
document.getElementById('menuBtn').onclick = e => { e.stopPropagation(); sheet.classList.add('open'); };
document.getElementById('closeSheet').onclick = () => sheet.classList.remove('open');
document.getElementById('showHots').onchange = e => stage.classList.toggle('show', e.target.checked);
setTimeout(() => document.getElementById('hint').style.opacity = 0, 4000);

show(byId[location.hash.slice(1)] ? location.hash.slice(1) : 'A1', false);
onhashchange = () => { const id = location.hash.slice(1); if (byId[id] && id !== current) show(id, false); };
SCREENS.forEach(s => { new Image().src = 'img/' + s.id + '.jpg?v=' + BUILD; }); // warm the cache so taps feel instant
</script>
</body>
</html>
